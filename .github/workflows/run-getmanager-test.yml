name: Test Run GetManager
on:
  workflow_dispatch: #支持页面手动运行

jobs:
  run_get:
    runs-on: ubuntu-latest
    env:
      kernelsu_variant: ReSukiSU
      ksu_branch: Stable(标准)
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq unzip

      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts

      - name: 解析KSU分支参数
        id: ksu-branch
        env:
          KSU_VARIANT: ${{ env.kernelsu_variant }}
          KSU_BRANCH: ${{ env.ksu_branch }}
        run: bash .github/scripts/resolve-ksu-ref.sh

      - name: 获取KSU & SUSFS版本
        id: get_version
        run: |
          if [ "${{ env.kernelsu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ env.kernelsu_variant }}" == "ReSukiSU" ]; then
            echo "This is the ReSukiSU variant"
            git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          elif [ "${{ env.kernelsu_variant }}" == "Official" ]; then
            echo "This is the Official"
            git clone https://github.com/tiann/KernelSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU
          # 新增：清空本地修改，解决之前gradlew.bat冲突报错
          git reset --hard HEAD
          git clean -fd

          # commit哈希/分支判断
          if [[ "$BRANCH" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Detected commit SHA, fetching it..."
              git fetch origin "$BRANCH" --depth=1
              git checkout "$BRANCH"
          else
              git checkout "$BRANCH" || git checkout -b "$BRANCH" "origin/$BRANCH"
          fi

          # 计算KSU版本
          KSU_GIT_VERSION=$(git rev-list --count HEAD)
          if [ "${{ env.kernelsu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "${{ env.kernelsu_variant }}" == "ReSukiSU" ]; then
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          elif [ "${{ env.kernelsu_variant }}" == "Official" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          fi

          # 获取SUSFS版本
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop\?ref_type\=heads"
          SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')

          # 输出结果到workflow变量
          echo "ksuVer=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "susVer=$SUS_VERSION" >> $GITHUB_OUTPUT
